plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
    // Release publishing only: applied below when the token env vars are set (.github/workflows/release.yml)
    id 'com.modrinth.minotaur' version '2.9.0' apply false
    id 'net.darkhax.curseforgegradle' version '1.1.28' apply false
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    // In-game automated tests (Fabric GameTest), run on a dedicated server: ./gradlew runGametest
    gametest {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "steveparty" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "steveparty-gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
            runDir "build/gametest"
            source sourceSets.gametest
        }
    }
}


repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup("maven.modrinth")
        }
    }
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client-only runtime mods for testing (not bundled)
    modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
    modLocalRuntime "maven.modrinth:iris:${project.iris_version}"
    // Recipe viewer in the dev client (JEI is not used on Fabric here; REI is the Fabric equivalent)
    modLocalRuntime "maven.modrinth:rei:16.0.799+fabric"
    // Optional REI plugin (client compat.rei, entrypoint rei_client): compiled against REI, never required at runtime
    modCompileOnly "maven.modrinth:rei:16.0.799+fabric"
    modCompileOnly "maven.modrinth:architectury-api:13.0.11+fabric"
    modCompileOnly "me.shedaniel.cloth:basic-math:0.6.1"
    modLocalRuntime "maven.modrinth:architectury-api:13.0.11+fabric"
    modLocalRuntime "maven.modrinth:cloth-config:15.0.140+fabric"
    modLocalRuntime "me.shedaniel.cloth:basic-math:0.6.1"
    // Optional Mod Menu entry (client compat.modmenu, entrypoint modmenu): the client options screen, never required
    modCompileOnly "maven.modrinth:modmenu:11.0.3"
    // Local-only dev mods (not in git)
    modLocalRuntime fileTree(dir: 'dev-mods', include: '*.jar')
    localRuntime "org.anarres:jcpp:1.4.14"
    localRuntime "io.github.douira:glsl-transformer:2.0.1"
    localRuntime "org.antlr:antlr4-runtime:4.13.1"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "geckolib_version", project.geckolib_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "geckolib_version": project.geckolib_version
    }
}

apply from: 'gradle/dev-server.gradle'
// Machine-local additions to the dev build (not in git)
if (file('local.gradle').exists()) apply from: 'local.gradle'

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    def archivesName = base.archivesName.get()
    from("LICENSE.txt") {
        rename { "${it}_${archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

// --- Modrinth / CurseForge publishing ---
// Inert unless MODRINTH_TOKEN / CURSEFORGE_TOKEN are set, which only release.yml does on a v* tag.
// mod_version comes from the tag there (-Pmod_version=...), so the jar and both listings match it.
def releaseChangelog = System.getenv('RELEASE_CHANGELOG') ?: 'See the GitHub release notes for this version.'
// release | beta | alpha: same names on both sites, derived from the tag suffix by release.yml
def releaseType = System.getenv('RELEASE_TYPE') ?: 'release'

if (System.getenv('MODRINTH_TOKEN') != null) {
    apply plugin: 'com.modrinth.minotaur'
    modrinth {
        token = System.getenv('MODRINTH_TOKEN')
        projectId = findProperty('modrinth_project_id') ?: 'REPLACE_WITH_MODRINTH_PROJECT_ID'
        versionNumber = project.mod_version
        versionName = "${project.mod_version} - Fabric ${project.minecraft_version}".toString()
        versionType = releaseType
        uploadFile = remapJar
        gameVersions = [project.minecraft_version]
        loaders = ['fabric']
        changelog = releaseChangelog
        dependencies {
            required.project 'fabric-api'
            required.project 'geckolib'
        }
    }
}

if (System.getenv('CURSEFORGE_TOKEN') != null) {
    apply plugin: 'net.darkhax.curseforgegradle'
    tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        dependsOn remapJar
        apiToken = System.getenv('CURSEFORGE_TOKEN')
        def mainFile = upload(findProperty('curseforge_project_id') ?: 'REPLACE_WITH_CURSEFORGE_PROJECT_ID', remapJar)
        mainFile.displayName = "${project.mod_version} - Fabric ${project.minecraft_version}".toString()
        mainFile.changelog = releaseChangelog
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = releaseType
        mainFile.addGameVersion(project.minecraft_version)
        mainFile.addModLoader('Fabric')
        // CurseForge rejects a file without a Java version and an environment (error 1021)
        mainFile.addJavaVersion("Java ${targetJavaVersion}".toString())
        mainFile.addEnvironment('Client')
        mainFile.addEnvironment('Server')
        mainFile.addRequirement('fabric-api')
        mainFile.addRequirement('geckolib')
    }
}
